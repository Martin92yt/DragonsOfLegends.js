name: Deploy Documentation

on:
  push:
    branches:
      - main # Remplace par 'master' si c'est le nom de ta branche principale

# Autorise les lectures/écritures pour GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/actions/setup-node@v4 # (ou setup-node@v4)
        with:
          node-version: '20' # Ajuste selon ta version de Node

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs # Le dossier généré par ta commande npm run docs